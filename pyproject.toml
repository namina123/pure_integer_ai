[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-integer-ai"
version = "0.1.0.dev0"
description = "Pure-Integer Deterministic Self-Learning Cognitive Architecture"
readme = { file = "README_EN.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jing Jianbin", email = "2698801855@qq.com" },
]
dependencies = [
  "fluent.syntax==0.19.0",
  "lxml==6.1.1",
  "markdown-it-py==4.2.0",
  "opencc-python-reimplemented==0.1.7",
  "polib==1.2.0",
  "typing_extensions==4.12.2",
  "wikitextparser==0.56.4",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
pure-integer-qa = "pure_integer_ai.experiments.run_ph2_w03_w04_w05_sparse_qa:main"
pure-integer-sense = "pure_integer_ai.experiments.run_ph2_w03_public_sense:main"
pure-integer-broad-qa = "pure_integer_ai.experiments.run_ph2_broad_qa:main"
pure-integer-broad-qa-joint = "pure_integer_ai.experiments.run_ph2_broad_qa_joint_eval:main"

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pure_integer_ai*"]

[tool.setuptools.package-data]
"pure_integer_ai.experiments" = [
  "ph2_broad_qa_normalization_recovery_v7_vscode_english_binding_ast.mjs",
]

[tool.setuptools.data-files]
"share/pure_integer_ai/data/ph2" = [
  "data/ph2/sparse_qa_runtime_snapshot_v1.json",
  "data/ph2/broad_qa_10k_dev_preview_receipt_v1.json",
  "data/ph2/broad_qa_20k_preview_receipt_v1.json",
  "data/ph2/broad_qa_external_evidence_eval_receipt_v1.json",
  "data/ph2/broad_qa_source_aligned_formal_receipt_v1.json",
  "data/ph2/broad_qa_dev_questions_v1.json",
  "data/ph2/broad_qa_interactive_dimensions_v1.json",
  "data/ph2/broad_qa_interactive_refusal_probes_v1.json",
  "data/ph2/broad_qa_interactive_development_receipt_v1.json",
  "data/ph2/broad_qa_question_slots_v1.json",
  "data/ph2/authored_primitive_atomic_bridge_map_generalization_v1.jsonl.sample",
  "data/ph2/authored_primitive_atomic_bridge_map_three_role_v1.jsonl.sample",
  "data/ph2/authored_primitive_atomic_bridge_seed_generalization_v1.jsonl.sample",
  "data/ph2/authored_primitive_atomic_bridge_seed_three_role_v1.jsonl.sample",
  "data/ph2/authored_semantic_primitive_bridge_generalization_v1.jsonl.sample",
  "data/ph2/authored_semantic_primitive_bridge_three_role_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_cause_generalization_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_effect_generalization_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_implicit_reason_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_implicit_result_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_three_role_actor_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_three_role_implicit_actor_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_three_role_implicit_location_v1.jsonl.sample",
  "data/ph2/authored_vertical_question_three_role_location_v1.jsonl.sample",
  "data/ph2/w03_public_sense_runtime_v1.json",
  "data/ph2/w03_public_sense_runtime_v2.json",
  "data/ph2/w03_public_sense_runtime_v3.json",
  "data/ph2/w03_public_sense_runtime_v4.json",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
