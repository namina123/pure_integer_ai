[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-integer-ai"
version = "0.1.0.dev0"
description = "Pure-Integer Deterministic Self-Learning Cognitive Architecture"
readme = { file = "README_EN.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jing Jianbin", email = "2698801855@qq.com" },
]
dependencies = [
  "fluent.syntax==0.19.0",
  "lxml==6.1.1",
  "markdown-it-py==4.2.0",
  "opencc-python-reimplemented==0.1.7",
  "polib==1.2.0",
  "typing_extensions==4.12.2",
  "wikitextparser==0.56.4",
]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
pure-integer-qa = "pure_integer_ai.experiments.run_ph2_w03_w04_w05_sparse_qa:main"
pure-integer-dialogue-demo = "pure_integer_ai.experiments.run_public_sentence_demo:main"
pure-integer-dialogue = "pure_integer_ai.experiments.run_public_frame_dialogue:main"
pure-integer-sense = "pure_integer_ai.experiments.run_ph2_w03_public_sense:main"
pure-integer-broad-qa = "pure_integer_ai.experiments.run_ph2_broad_qa:main"
pure-integer-broad-qa-joint = "pure_integer_ai.experiments.run_ph2_broad_qa_joint_eval:main"
pure-integer-trained-dialogue = "pure_integer_ai.experiments.run_trained_dialogue_terminal:main"
pure-integer-runtime-material = "pure_integer_ai.experiments.run_runtime_material_ingest:main"

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pure_integer_ai*"]

[tool.setuptools.package-data]
"pure_integer_ai.experiments" = [
  "ph2_broad_qa_normalization_recovery_v7_vscode_english_binding_ast.mjs",
]

